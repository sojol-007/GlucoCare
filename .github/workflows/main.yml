name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Locate project root
        id: locate
        run: |
          FOUND=$(find . -maxdepth 4 -name settings.gradle | head -n1)
          if [ -z "$FOUND" ]; then
            echo "::error::Could not find settings.gradle anywhere in the repo. Check that the project files were uploaded."
            exit 1
          fi
          DIR=$(dirname "$FOUND")
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "Found project at: $DIR"

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Build debug APK
        working-directory: ${{ steps.locate.outputs.dir }}
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GlucoCare-debug-apk
          path: ${{ steps.locate.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
